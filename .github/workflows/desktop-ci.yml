name: Desktop CI

# Rust 门禁与仓库主 CI 分开：
# - apps/desktop 的 workspace build 只做前端产物，因此 pnpm workspace:build 不需要 Rust；
# - Rust 编译需要工具链与平台系统依赖，塞进主 CI 会让所有 app 的验证被桌面构建绑架。
# 建议把本 workflow 的 verify-rust job 配为分支保护的 required check，
# 以免 ci:verify 与 Rust 之间出现无门禁窗口。

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'content/**'
      - 'scripts/generate-encyclopedia-content.mjs'
      - 'tests/desktop-offline-content.test.ts'
      - '.github/workflows/desktop-ci.yml'
  push:
    branches:
      - refactor/platform-rearchitecture
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'content/**'
      - 'scripts/generate-encyclopedia-content.mjs'
      - 'tests/desktop-offline-content.test.ts'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# 新提交取代旧验证，不影响发布工作流的串行保护。
concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-rust:
    name: Verify desktop Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Prefer Ubuntu archive for Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # 保留 runner 自带的 Azure 后备、security 源及签名校验，仅调整已知官方镜像的优先级。
          # https://github.com/actions/runner-images/blob/main/images/ubuntu/scripts/build/configure-apt-sources.sh
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's|^(https://archive\.ubuntu\.com/ubuntu/[[:blank:]]+)priority:2$|\1priority:0|' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop frontend
        run: pnpm --filter @mahoshojo/desktop run build

      - name: Verify packaged desktop offline content
        env:
          DESKTOP_OFFLINE_CONTENT_REQUIRE_DIST: '1'
        run: pnpm exec vitest run --config vitest.config.ts tests/desktop-offline-content.test.ts

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
